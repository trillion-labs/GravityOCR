[project]
name = "gravityocr"
version = "0.1.0"
description = "GravityOCR — block-diffusion self-speculative decoding for document OCR (inference + serving)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # cu128 wheels: the released environment runs a CUDA 12.8 driver (env/DRIVER.txt).
    # torch 2.9.1 provides the flex_attention used by the block-diffusion decoders.
    "torch==2.9.1",
    "torchvision==0.24.1",
    # transformers 5.x is required: GlmOcrForConditionalGeneration (model_type "glm_ocr")
    # is a built-in model only from the 5.x line (no remote code on the hub repo).
    "transformers>=5.8,<6",
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "pillow>=10.0",
    "numpy",
    "opencv-python-headless>=4.13.0.92",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
